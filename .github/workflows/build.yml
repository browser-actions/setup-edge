name: 'build-test'
on:
  pull_request:
  push:
    branches-ignore:
      - master
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: 'package.json'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: pnpm package
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: ./dist/

  test:
    needs: [build]
    strategy:
      matrix:
        os: [ubuntu, macos, windows]
    runs-on: ${{ matrix.os }}-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
      - name: "Install default channel on ${{ matrix.os }}"
        uses: ./
      - name: "Install stable channel on ${{ matrix.os }}"
        uses: ./
        with:
          edge-version: stable
      - name: "Install beta channel on ${{ matrix.os }}"
        uses: ./
        with:
          edge-version: beta
      - name: "Install dev channel on ${{ matrix.os }}"
        uses: ./
        with:
          edge-version: dev
      - name: "Install canary channel on ${{ matrix.os }}"
        uses: ./
        with:
          edge-version: canary
        # Canary channel for linux is not currently supported
        if: ${{ matrix.os != 'ubuntu' }}
